name: Server CI and deployment
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skillludo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: SkillLudo_Server
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: VoidInHeart/SkillLudo_Client
          ref: 3aa8a94eb4059a1912dba2f89a58e6394f48529b
          path: SkillLudo_Client
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Server checks and regression
        working-directory: SkillLudo_Server
        run: |
          npm ci
          npm run check
          npm run check:tests
          npm test
          npm run contract:check
          npm run build
          for script in start.sh deploy/*.sh; do bash -n "$script"; done
      - name: Paired client pure-logic regression
        working-directory: SkillLudo_Client
        run: |
          npm ci
          npm run check:tests
          npm test
      - name: Real MySQL schema and account integration
        working-directory: SkillLudo_Server
        env:
          NODE_ENV: production
          SKILLLUDO_DB_HOST: 127.0.0.1
          SKILLLUDO_DB_PORT: '3307'
          SKILLLUDO_DB_NAME: skill_ludo
          SKILLLUDO_DB_USER: skillludo_app
          SKILLLUDO_DB_PASSWORD: ci-only-application-password
        run: |
          server_pid=''
          trap 'if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true; fi; docker rm -f skillludo-ci-mysql >/dev/null 2>&1 || true' EXIT
          docker run -d --name skillludo-ci-mysql -p 127.0.0.1:3307:3306 -e MYSQL_ROOT_PASSWORD=ci-only-root-password -e MYSQL_DATABASE=skill_ludo -e MYSQL_USER=skillludo_app -e MYSQL_PASSWORD="$SKILLLUDO_DB_PASSWORD" mysql:8.4 --innodb-buffer-pool-size=128M --skip-name-resolve
          for attempt in $(seq 1 60); do
            if docker exec skillludo-ci-mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -h127.0.0.1 -e "SELECT 1"' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # Replay twice to catch initialization and privilege-idempotency errors.
          for attempt in 1 2; do
            docker exec -i skillludo-ci-mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -uroot' < deploy/schema.sql
          done
          node dist/index.js > "$RUNNER_TEMP/skillludo-integration.log" 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/readyz >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
          node scripts/auth-benchmark.mjs
      - name: Build immutable release image
        working-directory: SkillLudo_Server
        run: |
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "skillludo/server:sha-$GITHUB_SHA" .
          container=$(docker create "skillludo/server:sha-$GITHUB_SHA")
          mkdir ../runtime
          docker cp "$container:/app/." ../runtime/
          docker rm "$container"
          tar -czhf ../server-runtime.tar.gz -C ../runtime .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: server-runtime-${{ github.sha }}
          path: server-runtime.tar.gz
          retention-days: 7
          compression-level: 0
  deploy:
    needs: verify-and-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-runtime-${{ github.sha }}
      - name: Deploy using restricted SSH key
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          key="$RUNNER_TEMP/skillludo_key"
          hosts="$RUNNER_TEMP/skillludo_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA" < server-runtime.tar.gz
      - name: Verify public readiness and deployed revision
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          curl --fail --retry 5 --retry-delay 3 --max-time 10 "http://$DEPLOY_HOST/readyz" -o readiness.json
          EXPECTED="$GITHUB_SHA" node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("readiness.json"));if(r.status!=="ok"||r.revision!==process.env.EXPECTED)process.exit(1);console.log("Public readiness and revision verified")'
